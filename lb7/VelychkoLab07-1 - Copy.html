<html>
<head>
     <TITLE> Використання cенсорних зображень </TITLE>
     <meta charset=UTF-8>
     <map name="map1">
</head>
<body>
	<form>
		Ваше ім'я: <input name="name" type="text" maxlength="40" size="40" value=""><br>
		Ваша стать:<input type="radio" name="pol" value="male">Чоловіча
          <input type="radio" name="sex" value="female">Жіноча<br>
		На якому курсі Ви навчаєтесь?  
          <select name="year" size="1">
               <option value="1" selected>1</option>
               <option value="2">2</option>
               <option value="3">3</option>
               <option value="4">4</option>
               <option value="5">5 </option>
          </select><br>
		Які дисципліни ви вивчаєте на курсі?
  		<input type="checkbox" name="webp" value="yes" checked> WEB-програмування
   		<input type="checkbox" name="kttap" value="yes">Комп'ютерні технології та програмування<br>
		Напишіть декілька слів про себе:<br>		
    		<textarea name="about" rows="6" cols="60" wrap="off"></textarea>
		<p><input type="submit" value="Надіслати дані"></p>
     	<input type="reset" value="Очистити форму">
     	<input type="file" name="friend" size="50" accept="припустимий тип файлу"> 
	</form>
</body> 
</html>
