<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-row > div,
        .content-row > div,
        .footer-row > div {
            border: 1px solid #d3d3d3;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 1200px) {
            .left-header {
                background-color: #fd9 !important;
                color: black !important;
            }

            .right-header {
                color: red !important;
                font-weight: bold;
            }

            .left-footer {
                color: blue !important;
                font-weight: bold;
            }

            .right-footer {
                background-color: #fd9 !important;
                color: black !important;
            }
        }

        @media (min-width: 992px) and (max-width: 1199px) {
            .right-header {
                background-color: #ffcccc !important;
                min-height: 100px !important;
                color: black !important;
            }

            .main-content {
                background-color: #ffcccc !important;
                color: black !important;
                min-height: 260px !important;
            }

            .left-footer {
                background-color: #ffcccc !important;
                min-height: 90px !important;
                color: black !important;
            }
        }

        @media (min-width: 768px) and (max-width: 991px) {
            .right-header {
                font-size: 1.5em !important;
            }

            .left-menu,
            .right-menu {
                background-color: #e6ccff !important;
                color: black !important;
                min-height: 60px !important;
            }

            .main-content {
                font-size: 1.5em !important;
                min-height: 300px !important;
            }
        }

        @media (max-width: 767px) {
            .header-row>div {
                color: green !important;
                margin-top: -1px !important;
            }
            .footer-row>div {
                color: green !important;
                margin-bottom: -1px !important;
            }

            .main-content {
                color: green !important;
                min-height: 260px !important;
            }

            .left-menu { color: green !important; }
            .right-menu {
                color: green !important;
                min-height: 60px !important;
            }
        }

        .container-fluid {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content-row {
            flex: 1;
        }

        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row header-row">
            <div class="col-xl-8 col-lg-4 col-md-6 col-sm-12 col-12 left-header">
                Лівий header
            </div>
            <div class="col-xl-4 col-lg-8 col-md-6 col-sm-12 col-12 right-header">
                Правий header
            </div>
        </div>
        
        <div class="row content-row">
            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12 left-menu">
                Ліве меню
            </div>
            <div class="col-xl-8 col-lg-8 col-md-12 col-sm-12 col-12 main-content">
                Контент
            </div>
            <div class="col-xl-2 col-lg-2 col-md-12 col-sm-12 col-12 right-menu">
                Праве меню
            </div>
        </div>

        <div class="row footer-row">
            <div class="col-xl-4 col-lg-8 col-md-6 col-sm-12 col-12 left-footer">
                Лівий footer
            </div>
            <div class="col-xl-8 col-lg-4 col-md-6 col-sm-12 col-12 right-footer">
                Правий footer
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
