<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .block-1,
        .block-2,
        .block-3 {
            border: 1px solid #d3d3d3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            padding: 15px;
            min-height: 50px;
        }

        .block-1 {
            background-color: #007bff;
            color: white;
        }

        .block-2 {
            background-color: #ffc107;
            color: black;
        }

        .block-3 {
            background-color: #dc3545;
            color: white;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .container-fluid {
            padding: 0;
            height: 100vh;
        }

        .main-content {
            height: 100%;
        }

        @media (max-width: 767px) {
            .main-content {
                min-height: 100vh;
            }

            .block-1,
            .block-2,
            .block-3 {
                min-height: 33vh;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid vh-100 d-flex flex-column">

        <div class="row flex-grow-1 main-content g-0">

            <div class="col-xl-6 col-lg-8 col-md-12 col-sm-12 col-12 block-1">
                #1
            </div>

            <div class="col-xl-3 col-lg-12 col-md-6 col-sm-12 col-12 block-3 order-md-1 order-lg-2">
                #3
            </div>

            <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12 col-12 block-2 order-md-2 order-lg-1">
                #2
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
