<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Мої хобі</title>
  <link rel="stylesheet" href="./my-app/src/index.css">
  <link rel="stylesheet" href="./my-app/src/App.css">
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for in-browser JSX transpile (dev only) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function Hobby({ title, children }) {
      return (
        <div className="center ">
          <h2 className="title">{title}</h2>
          <p className="text">{children}</p>
          <br />
        </div>
      );
    }

    function List(table) {
      return table.map((table) => <li key={table.id}>{table.value}</li>)
    }

    class HobbyWithAList extends React.Component {
      render() {
        const { title, children, list } = this.props;
        return (
          <div className="center">
            <h2 className="title">{title}</h2>
            <p className="text">{children}</p>
            <br />
            {List(list)}
            <br />
          </div>
        );
      }
    }

    const tracks = [
      {id: 1, value: "Boards of Canada - Left Side Drive"},
      {id: 2, value: "Jukio Kallio - Groundworks of the Past"},
      {id: 3, value: "Soundgarden - Black Hole Sun"},
      {id: 4, value: "Crystal Castles - Magic Spells"},
      {id: 5, value: "Creo - Dark Tides"},
      {id: 6, value: "Aphex Twin - Flim"},
    ];

    const games = [
      {id: 1, value: "Factorio"},
      {id: 2, value: "Terraria"},
      {id: 3, value: "Rain World"},
      {id: 4, value: "Celeste"},
    ];

    function App() {
      return (
        <div className="app-root">
          <h1>Лабораторна робота №10</h1>
          <h2>react (cdn)</h2>
          <hr className="divider" />
          <Hobby title="Мої хобі">
            Часто слухаю музику. У вільний час (якщо він є) я зазвичай граю в ігри, інколи малюю.
          </Hobby>

          <HobbyWithAList title="Музика" list={tracks}>
            Я люблю слухати музику.
          </HobbyWithAList>

          <HobbyWithAList title="Ігри" list={games}>
            Інколи я розв'язую кросворди або складаю пазли. Час від часу граю у відеоігри, ось декілька з моїх улюблених:
          </HobbyWithAList>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
