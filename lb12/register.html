<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #3ba4ff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff4b4b;
        }

        .header-left {
            color: rgb(0, 0, 0);
        }

        .blog-title {
            margin: 0;
            font-size: 20px;
        }

        .author {
            font-size: 14px;
        }

        .header-right .nav-link {
            color: white;
            margin-left: 15px;
            font-weight: bold;
            text-decoration: none;
        }

        .header-right .nav-link:hover {
            text-decoration: underline;
        }

        .main-content {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 0;
        }

        .reg-form {
            width: 40%;
            background: white;
            padding: 20px;
            border: 3px solid gray;
        }

        .page-title {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }

        input,
        select {
            width: 95%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
        }

        .submit-btn {
            width: 60%;
            float: right;
            padding: 12px;
            background: whitesmoke;
            border: 2px solid gray;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #1e2a34;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <h2 class="blog-title">Мій особистий блог</h2>
            <span class="author">Величко Олексій</span>
        </div>
        <nav class="header-right">
            <a href="#" class="nav-link">Вхід</a>
            <a href="../lb7/VelychkoLab07-1.html" class="nav-link">Реєстрація</a>
        </nav>

    </header>
    <div class="main-content">
        <form action="#" method="get" class="reg-form">
            <h1 class="page-title">Реєстрація</h1>
            <div class="form-group">
                <label for="first_name">Ім'я</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Прізвище</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="group">Навчальна група</label>
                <select id="group" required>
                    <option value="" disabled selected>Оберіть групу</option>
                    <option value="301">301</option>
                    <option value="302">302</option>
                    <option value="303">303</option>
                    <option value="304">304</option>
                    <option value="305">305</option>
                </select>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Підтвердження паролю</label>
                <input type="password" id="confirm_password" required>
            </div>
            <button type="submit" class="submit-btn">Зареєструватись</button>
        </form>
    </div>
    <footer class="footer">
        © Всі права захищені.
    </footer>
</body>

</html>
