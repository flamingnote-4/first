<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Текст, що біжить</title>
</head>
<body>
	<marquee behavior="alternate" direction="down" width=50 bgcolor="#000" height=250>
		<img height="50" src="spin.gif">
		<font color="#ff0" face="Arial" size="2">Текст!</font>
	</marquee>
	<marquee behavior="scroll" direction="up" width=50 bgcolor="#000" height=250>
		<img height="50" src="spin.gif">
		<img height="50" src="spin.gif">
	</marquee>
	<marquee behavior="slide" direction="down" width=50 bgcolor="#000" height=250>
		<img height="50" src="spin.gif">
		<img height="50" src="spin.gif">
	</marquee>
	<marquee behavior="alternate" direction="down" width=50 bgcolor="#000" height=250 scrollamount="10">
		<font color="#ff0" face="Arial" size="2">Швидко</font>
	</marquee>
	<marquee behavior="alternate" direction="down" width=60 bgcolor="#000" height=250 scrollamount="2">
		<font color="#ff0" face="Arial" size="2">повільно</font>
	</marquee>
</body>
</html>
