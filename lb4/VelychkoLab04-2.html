<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Текст, що біжить</title>
</head>
<body background="spin.gif">
	<marquee behavior="alternate"  width=100% bgcolor="#000" height=50>
		<font color="#ff0" face="Arial" size="5">З боку в бік</font>
	</marquee>
	<br>
	<marquee behavior="scroll" direction="right" width=100% bgcolor="#000" height=50>
		<font color="#ff0" face="Arial" size="5">Справа наліво</font>
	</marquee>
	<br>
	<marquee behavior="slide" direction="left" width=100% bgcolor="#000" height=50>
		<font color="#ff0" face="Arial" size="5">Зліва направо із зупинкою</font>
	</marquee>
	<br>
	<marquee behavior="alternate" scrollamount="10" width=100% bgcolor="#000" height=50>
		<font color="#ff0" face="Arial" size="5">Швидкий</font>
	</marquee>
	<br>
	<marquee behavior="alternate" scrollamount="1" width=100% bgcolor="#000" height=50>
		<font color="#ff0" face="Arial" size="5">Повільний</font>
	</marquee>
	<br>
</body>
</html>
